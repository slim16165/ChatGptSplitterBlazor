name: Deploy to Heroku

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ${{ fromJSON(((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || vars.CI_RUNNER_LINUX_JSON || '["ubuntu-latest"]') }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'  # o la tua versione di .NET

    - name: Build and Publish
      run: dotnet publish "ChatGPT Splitter Blazor/ChatGPT Splitter Blazor New.csproj" -c Release -o ./publish

    - name: Deploy to Heroku
      uses: akhileshns/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: "chatgptsplitter"  # sostituisci con il nome della tua app su Heroku
        heroku_email: "hyperreview@gmail.com"
        usedocker: true
        appdir: "publish"
